
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>College Portal</title>
    </head>
    <body>
        <!-- Semantic layout -->
        <header>
            <h1>College Portal</h1>
        </header>
        
        <nav>
            <a href="#home">Home</a> |
            <a href="#courses">Courses</a>
        </nav>
        
        <main id="home">
            <section>
                <h2>Admission Open</h2>
                <p>Apply before 30 June.</p>
            </section>
        </main>
        
        <aside>
            <p>Notice: Library closed Sunday.</p>
        </aside> 
        
        <footer>
            <p>&copy; 2026 College</p>
        </footer>
        
        <!-- A non-semantic layout can also be made using div elements -->
        <div>
            <div>Header area made with div</div>
            <div>Main content made with div</div>
            <div>Footer area made with div</div>
        </div>
    </body>
</html>
